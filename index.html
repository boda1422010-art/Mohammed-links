<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0a0a0a;background:radial-gradient(circle at 50% 0%, #2a2a2a 0%, #0a0a0a 70%);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Inter,system-ui,sans-serif}
.card{width:100%;max-width:400px;background:rgba(255,255,255,0.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:32px;padding:36px 24px 28px;text-align:center}
.avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 20px;display:block;border:3px solid rgba(255,255,255,0.15);filter:grayscale(100%)}
h1{color:#fff;font-size:30px;font-weight:800;margin-bottom:6px}
.role{color:#fff;opacity:0.8;font-size:16px;margin-bottom:6px}
.email{color:#fff;opacity:0.4;font-size:13px;margin-bottom:28px;word-break:break-all}
.links{display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:16px 18px;color:#fff;text-decoration:none;font-weight:600;font-size:15px;transition:0.2s}
.link:hover{background:rgba(255,255,255,0.20);transform:translateY(-1px)}
.link i{font-size:18px}
.arrow{opacity:0.6;font-size:12px}
.ip-logo{width:22px;height:22px;border-radius:6px;object-fit:cover}
.cv{background:rgba(255,255,255,0.95) !important;color:#000 !important}
.cv .arrow{color:#000}
.snap{background:#FFFC00 !important;color:#000 !important}
.snap i{color:#000}
.snap .arrow{color:#000}
</style>
