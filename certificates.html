<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شهادات الخبرة - Mohamed Yasser</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0a0a0a;background:radial-gradient(circle at 50% 0%, #2a2a2a 0%, #0a0a0a 70%);padding:20px;font-family:Inter,system-ui,sans-serif;color:#fff}
.container{max-width:900px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.1);padding:10px 16px;border-radius:12px;text-decoration:none;color:#fff;font-size:14px;margin-bottom:20px}
h1{font-size:32px;font-weight:800;margin-bottom:8px;text-align:center}
.subtitle{opacity:0.6;font-size:14px;text-align:center;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.cert-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.12);border-radius:24px;overflow:hidden;transition:0.3s}
.cert-card:hover{transform:translateY(-5px);border-color:rgba(245,158,11,0.5)}
.cert-card img{width:100%;height:auto;display:block}
.info{padding:18px}
.info h3{font-size:18px;margin-bottom:6px}
.info p{font-size:13px;opacity:0.6;margin-bottom:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#000;padding:12px;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px}
.btn.gold{background:linear-gradient(135deg, #f59e0b, #d97706);color:#000}
</style>
</head>
<body>
<div class="container">
<a href="index.html" class="back"><i class="fas fa-arrow-right"></i> الرجوع للرئيسية</a>
<h1><i class="fas fa-award" style="color:#f59e0b"></i> شهادات الخبرة</h1>
<p class="subtitle">جميع الشهادات والدورات الحاصل عليها</p>
<div class="grid">
  <div class="cert-card">
    <img src="khbra-certificate.jpg" alt="شهادة">
    <div class="info">
      <h3>أساسيات العمل على خمسات</h3>
      <p>Mohamed Yasser - 14 نوفمبر 2026 - منصة خبرة</p>
      <a class="btn gold" href="https://khbra.com/attempts/a07cb716-1423-400a-8e2d-b96c2b69eea0" target="_blank"><i class="fas fa-external-link-alt"></i> عرض والتحقق من الشهادة</a>
    </div>
  </div>
</div>
</div>
</body>
</html>
